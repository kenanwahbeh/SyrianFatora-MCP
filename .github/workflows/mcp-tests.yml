name: MCP Resource Worker tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "test/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mcp-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=JSON.parse(require('node:fs').readFileSync('npm-audit.json','utf8')); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, vulnerabilities:Object.fromEntries(Object.entries(a.vulnerabilities??{}).map(([name,v])=>[name,{severity:v.severity,range:v.range,via:v.via,fixAvailable:v.fixAvailable}]))},null,2))"
      - name: Build Worker with cf (no deployment)
        run: npm run build:check
      - name: Run MCP resource-worker tests
        run: npm test
