name: MCP Resource Worker tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "test/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  mcp-unit-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate and commit npm lockfile if missing
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(mcp): add npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bundle Worker without deploying
        run: npm run build:check
      - name: Run MCP resource-worker tests
        run: npm test
