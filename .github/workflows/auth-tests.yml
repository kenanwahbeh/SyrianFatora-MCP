name: Auth Worker tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  auth-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/auth
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Match Cloudflare Build npm version
        run: npm install --global npm@10.9.2
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Enforce high-severity dependency audit
        run: npm audit --audit-level=high
      - name: Build Worker with cf (no deployment)
        run: npm run build:check
      - name: Run unit tests
        run: npm test
